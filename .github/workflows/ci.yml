name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/config.js && node --check src/notebooklm.js && node --check src/server.js && node --check src/icloud.js && node --check src/icloud-server.js && node --check scripts/login.js && node --check scripts/smoke.js && node --check scripts/icloud-smoke.js

      - name: iCloud MCP smoke test (simulated drive, no account needed)
        run: npm run smoke:icloud

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test (MCP handshake + browser launch)
        run: npm run smoke
        env:
          NOTEBOOKLM_HEADLESS: "1"

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
